name: Setup Bun + cache
description: Install Bun and restore the Bun package cache.
inputs:
  bun-version:
    description: Bun version to install.
    required: false
    default: "1.3.8"
  cache-key-suffix:
    description: Suffix appended to the cache key.
    required: false
    default: "node22"
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Resolve Bun cache path
      id: bun-cache
      shell: bash
      run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.bun-cache.outputs.path }}
        key: ${{ runner.os }}-bun-cache-${{ inputs.cache-key-suffix }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-cache-${{ inputs.cache-key-suffix }}-
