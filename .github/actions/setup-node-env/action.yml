name: Setup Node environment
description: >
  Initialize submodules with retry, install Node 22 + Bun, and run bun install.
  Requires actions/checkout to run first.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22.x"
  bun-version:
    description: Bun version to install.
    required: false
    default: "1.3.8"
  frozen-lockfile:
    description: Whether to use --frozen-lockfile for install.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Checkout submodules (retry)
      shell: bash
      run: |
        set -euo pipefail
        git submodule sync --recursive
        for attempt in 1 2 3 4 5; do
          if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
            exit 0
          fi
          echo "Submodule update failed (attempt $attempt/5). Retrying…"
          sleep $((attempt * 10))
        done
        exit 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: true

    - name: Setup Bun + cache
      uses: ./.github/actions/setup-bun-cache
      with:
        bun-version: ${{ inputs.bun-version }}
        cache-key-suffix: "node22"

    - name: Runtime versions
      shell: bash
      run: |
        node -v
        npm -v
        bun -v

    - name: Capture node path
      shell: bash
      run: echo "NODE_BIN=$(dirname "$(node -p "process.execPath")")" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      env:
        CI: "true"
      run: |
        export PATH="$NODE_BIN:$PATH"
        which node
        node -v
        bun -v
        LOCKFILE_FLAG=""
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          LOCKFILE_FLAG="--frozen-lockfile"
        fi
        bun install $LOCKFILE_FLAG
